<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#121212">
<title>Калькулятор дозы (Неон)</title>
<style>
    :root {
        --bg: #121212;
        --card-bg: #1e1e1e;
        --border: #333333;
        --neon: #00ffcc;
        --text: #e0e0e0;
        --muted: 0.3;
    }

    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        font-family: 'Courier New', monospace;
        background-color: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 20px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
        user-select: none;
    }

    .container {
        width: 100%;
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding-bottom: 20px;
    }

    /* Общие стили карточек */
    .card {
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 8px;
        display: flex;
        flex-direction: column; /* Делаем колонку, чтобы текст точно был в 2 строки */
        align-items: center;
        justify-content: center;
        text-align: center;
        cursor: pointer;
        transition: all 0.3s ease;
        padding: 12px 10px;
        font-size: 15px;
        font-weight: bold;
        line-height: 1.2;
        color: var(--text);
    }

    /* Активное состояние */
    .card.active-card {
        border-color: var(--neon);
        box-shadow: 0 0 12px rgba(0, 255, 204, 0.6), inset 0 0 8px rgba(0, 255, 204, 0.2);
        color: var(--neon);
        transform: scale(1.02);
    }

    /* Неактивное */
    .card.dimmed {
        opacity: var(--muted);
        filter: grayscale(80%);
    }

    /* Сетки */
    .grid-2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
    }

    .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
    }

    .grid-4 .card {
        padding: 12px 4px;
        font-size: 14px;
    }

    /* Текст внутри карточек животных */
    .animal-title {
        display: block; /* Блочный элемент = новая строка */
        margin-bottom: 4px; 
    }
    .animal-dose {
        display: block; /* Блочный элемент = новая строка */
        font-size: 13px;
    }

    /* Блок с весом */
    .weight-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
    }

    .weight-label {
        flex: 1;
        text-align: right;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 1px;
        line-height: 1.2;
    }

    .input-box {
        border: 2px solid var(--border);
        border-radius: 8px;
        flex: 1.2;
        background: var(--card-bg);
        transition: 0.3s;
    }

    .input-box:focus-within {
        border-color: var(--neon);
        box-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
    }

    input[type="number"] {
        width: 100%;
        padding: 16px;
        border: none;
        border-radius: 8px;
        font-size: 24px;
        text-align: center;
        outline: none;
        background: transparent;
        color: var(--neon);
        font-family: inherit;
        font-weight: bold;
        -moz-appearance: textfield;
    }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
    }

    input[type="number"]::placeholder {
        color: rgba(224, 224, 224, 0.3);
    }

    /* Заголовки */
    .section-title {
        text-align: center;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--text);
    }

    /* Блок вывода дозы */
    .dose-row {
        display: flex;
        gap: 16px;
        align-items: stretch;
    }

    .dose-label {
        flex: 1;
        text-align: right;
        font-size: 16px;
        font-weight: bold;
        text-transform: uppercase;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        letter-spacing: 1px;
    }

    .dose-results {
        flex: 1.5;
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    .result-box {
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-left: 4px solid var(--neon);
        border-radius: 4px;
        padding: 10px 12px;
        font-size: 14px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-height: 50px;
        transition: 0.3s;
    }

    .result-box.has-value {
        border-left-color: var(--neon);
        box-shadow: 0 0 8px rgba(0, 255, 204, 0.2);
    }

    /* Настройки для строки с результатом */
    .res-line-1, .res-line-2 {
        display: flex;
        justify-content: space-between;
        width: 100%;
        align-items: center;
        white-space: nowrap;
    }
    .res-line-1 { margin-bottom: 4px; }
    
    .label { color: #888; }
    .val {
        color: var(--neon);
        font-weight: bold;
        font-size: 15px;
        text-align: right;
        margin-left: 10px;
    }
    .val.empty { color: #444; }
    .val-sm { font-size: 14px; }

</style>
</head>
<body>

<div class="container">
    
    <!-- Выбор животного -->
    <div class="grid-2">
        <div class="card" id="btnDog" data-type="animal" data-val="2.0">
            <span class="animal-title">СОБАКА</span>
            <span class="animal-dose">2 мг/кг</span>
        </div>
        <div class="card" id="btnCat" data-type="animal" data-val="1.5">
            <span class="animal-title">КОШКА</span>
            <span class="animal-dose">1,5 мг/кг</span>
        </div>
    </div>

    <!-- Ввод веса -->
    <div class="weight-row">
        <div class="weight-label">Вес<br>питомца</div>
        <div class="input-box">
            <input type="number" id="weightInput" placeholder="0" min="0" step="0.1" inputmode="decimal">
        </div>
    </div>

    <!-- Заголовок и выбор ропивакаина -->
    <div class="section-title">Ропивакаин</div>
    <div class="grid-4" id="ropGrid">
        <div class="card" data-type="rop" data-val="2.0">2 мг</div>
        <div class="card" data-type="rop" data-val="5.0">5 мг</div>
        <div class="card" data-type="rop" data-val="7.5">7,5 мг</div>
        <div class="card" data-type="rop" data-val="10.0">10 мг</div>
    </div>

    <!-- Вывод результата -->
    <div class="dose-row">
        <div class="dose-label">Доза:</div>
        <div class="dose-results">
            
            <div class="result-box" id="boxTotal">
                <div class="res-line-1">
                    <span class="label">Всего (на сторону):</span>
                    <span class="val empty" id="resTotal">-</span>
                </div>
            </div>
            
            <div class="result-box" id="boxRop">
                <div class="res-line-1">
                    <span class="label">Препарат:</span>
                    <span class="val empty" id="resRop">-</span>
                </div>
            </div>
            
            <div class="result-box" id="boxFinal">
                <div class="res-line-1">
                    <span class="label">Итого (на сторону):</span>
                    <span class="val empty" id="resRopHalf">-</span>
                </div>
                <div class="res-line-2">
                    <span class="label"></span>
                    <span class="val empty val-sm" id="resNaclHalf">-</span>
                </div>
            </div>

        </div>
    </div>

</div>

<script>
    let selectedAnimal = null;
    let selectedRop = null;

    const cards = document.querySelectorAll('.card');
    const weightInput = document.getElementById('weightInput');
    
    const resTotal = document.getElementById('resTotal');
    const resRop = document.getElementById('resRop');
    const resRopHalf = document.getElementById('resRopHalf');
    const resNaclHalf = document.getElementById('resNaclHalf');
    
    const boxTotal = document.getElementById('boxTotal');
    const boxRop = document.getElementById('boxRop');
    const boxFinal = document.getElementById('boxFinal');

    function updateVisuals() {
        cards.forEach(card => {
            const type = card.dataset.type;
            const val = parseFloat(card.dataset.val);
            
            let isSelected = false;
            if (type === 'animal' && val === selectedAnimal) isSelected = true;
            if (type === 'rop' && val === selectedRop) isSelected = true;

            if (isSelected) {
                card.classList.add('active-card');
                card.classList.remove('dimmed');
            } else {
                card.classList.remove('active-card');
                card.classList.add('dimmed');
            }
        });
    }

    function calculate() {
        const weight = parseFloat(weightInput.value.replace(',', '.'));

        if (isNaN(weight) || weight <= 0 || selectedAnimal === null || selectedRop === null) {
            resTotal.textContent = '-';
            resRop.textContent = '-';
            resRopHalf.textContent = '-';
            resNaclHalf.textContent = '-';
            
            [resTotal, resRop, resRopHalf, resNaclHalf].forEach(el => el.classList.add('empty'));
            [boxTotal, boxRop, boxFinal].forEach(el => el.classList.remove('has-value'));
            return;
        }

        const total = 0.5 * weight; 
        const ropTotal = (selectedAnimal * weight) / selectedRop; 
        const ropHalf = ropTotal / 2; 
        const naclHalf = total - ropHalf; 

        const fmt = (num) => num.toFixed(2).replace('.', ',');

        resTotal.textContent = fmt(total) + ' мл';
        resRop.textContent = fmt(ropTotal) + ' мл';
        resRopHalf.textContent = fmt(ropHalf) + ' мл';
        resNaclHalf.textContent = '+ ' + fmt(naclHalf) + ' мл NaCl';

        [resTotal, resRop, resRopHalf, resNaclHalf].forEach(el => el.classList.remove('empty'));
        [boxTotal, boxRop, boxFinal].forEach(el => el.classList.add('has-value'));
    }

    cards.forEach(card => {
        card.addEventListener('click', () => {
            const type = card.dataset.type;
            const val = parseFloat(card.dataset.val);

            if (type === 'animal') selectedAnimal = val;
            if (type === 'rop') selectedRop = val;

            updateVisuals();
            calculate();
        });
    });

    weightInput.addEventListener('input', calculate);
    updateVisuals();

</script>

</body>
</html>
